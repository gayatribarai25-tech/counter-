<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>


    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 100px;
        }


        #count {
            font-size: 40px;
            margin: 20px;
        }


        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>


<body>


    <h1>Counter App</h1>


    <div id="count">0</div>


    <button onclick="decrease()">Decrease</button>
    <button onclick="increase()">Increase</button>
    <button onclick="reset()">Reset</button>




    <script>
        let count = 0;


        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }


        function decrease() {
            if (count > 0) {
                count--;
                document.getElementById("count").innerText = count;
            }
        }


        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>


</body>
</html>
